[package]
name = "gmail-multi"
version = "0.1.0"
description = "Gmail multi-comptes léger"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable" active les webviews multiples dans une même fenêtre (API Window::add_child)
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
