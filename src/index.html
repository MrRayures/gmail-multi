<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barre latérale</title>
<style>
  /* Thème Dracula Classic (https://draculatheme.com/spec) : Background, Background Dark,
     Foreground, Comment, Purple ; bordures en Current Line, survols en Background Light.
     Thème clair (body.light) : Alucard, la variante claire de Dracula. */
  :root { --bg: #282a36; --bg-dark: #21222c; --content: #191a21; --fg: #f8f8f2; --muted: #6272a4; --accent: #bd93f9;
    --line: #44475a; --hover: #343746; --hover-strong: #424450; --shadow: #191a21; }
  body.light { --bg: #fffbeb; --bg-dark: #f4efd9; --content: #e9e4cc; --fg: #1f1f1f; --muted: #635d97; --accent: #644ac9;
    --line: #cfcfde; --hover: #ece7d2; --hover-strong: #e2dcc4; --shadow: #1f1f1f40; }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body { height: 100%; background: var(--bg); color: var(--fg);
    font: 12px "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #bar { width: 68px; height: 100%; display: flex; flex-direction: column; align-items: center; padding: 10px 0 0; gap: 8px; }
  #accounts { display: flex; flex-direction: column; gap: 10px; align-items: center; overflow-y: auto; flex: 1; width: 100%; padding: 2px 0; scrollbar-width: none; }
  #accounts::-webkit-scrollbar { display: none; }
  .acc { position: relative; width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center;
    border: 0; padding: 0; font: 600 17px "Segoe UI", system-ui, sans-serif; color: #282a36; cursor: pointer; opacity: .55;
    transition: opacity .15s, transform .15s; }
  .acc:hover, .acc:focus-visible { opacity: .9; }
  .acc:focus-visible, .round:focus-visible, .svc:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Le compte actif reste rond : il se distingue par son opacité et la barre à sa gauche */
  .acc.active { opacity: 1; }
  .acc.active::before { content: ""; position: absolute; left: -14px; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: var(--fg); }
  .acc { touch-action: none; }
  .acc.dragging { opacity: 1; transform: scale(1.12); cursor: grabbing; z-index: 1; box-shadow: 0 4px 14px var(--shadow); }
  .acc img { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: inherit; object-fit: cover; pointer-events: none; }
  .round { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center;
    color: var(--fg); border: 0; cursor: pointer; background: var(--hover); }
  .round:hover { background: var(--hover-strong); }
  /* Attributs communs des icônes Lucide, dessinées en couleur du texte */
  .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* Bascule de thème : l'icône montre le thème vers lequel on passe */
  #theme .moon, body.light #theme .sun { display: none; }
  body.light #theme .moon { display: block; }
  #services { display: flex; flex-direction: column; gap: 4px; width: 100%; padding: 8px 6px 10px; border-top: 1px solid var(--line); background: var(--bg-dark); }
  .svc { background: none; border: 0; color: var(--fg); cursor: pointer; padding: 6px 0; border-radius: 8px; font: inherit; }
  .svc:hover { background: var(--hover); }
  .svc .icon { display: block; margin: 0 auto 4px; pointer-events: none; }
  /* Zone du contenu, plus foncée que la barre : visible à droite tant que la vue du compte
     n'est pas affichée par-dessus. L'anneau ne tourne que pendant un chargement. */
  #loader { position: fixed; left: 68px; right: 0; top: 0; bottom: 0; display: grid; place-items: center; background: var(--content); }
  body.loading #loader::before { content: ""; width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Réglage Windows « Effets d'animation » désactivé : pas de transition, et un loader ralenti
     (il doit rester visible pour signaler le chargement) */
  @media (prefers-reduced-motion: reduce) {
    .acc { transition: none; }
    body.loading #loader::before { animation-duration: 2.4s; }
  }
</style>
</head>
<body class="loading">
<div id="loader"></div>
<div id="bar">
  <div id="accounts"></div>
  <!-- Icônes Lucide (https://lucide.dev, licence ISC : voir licenses/lucide.txt) -->
  <button type="button" class="round" id="add" title="Ajouter un compte"><svg aria-hidden="true" class="icon" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
  <button type="button" class="round" id="theme"><svg aria-hidden="true" class="icon sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg><svg aria-hidden="true" class="icon moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
  <div id="services">
    <button type="button" class="svc" data-svc="gmail" title="Gmail"><svg aria-hidden="true" class="icon" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>Mail</button>
    <button type="button" class="svc" data-svc="calendar" title="Agenda"><svg aria-hidden="true" class="icon" viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>Agenda</button>
    <button type="button" class="svc" data-svc="drive" title="Drive"><svg aria-hidden="true" class="icon" viewBox="0 0 24 24"><line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/></svg>Drive</button>
    <button type="button" class="svc" data-svc="meet" title="Meet"><svg aria-hidden="true" class="icon" viewBox="0 0 24 24"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>Meet</button>
  </div>
</div>

<script src="colors.js"></script>
<script>
const { invoke } = window.__TAURI__.core;
const $ = (s) => document.querySelector(s);
let state = { accounts: [], active: null };
let drag = null;
let dragged = false;
let pendingRender = false;

function render() {
  const box = $("#accounts");
  // La liste est reconstruite : on rendra le focus clavier à la pastille qui l'avait
  const focused = box.contains(document.activeElement) ? document.activeElement.dataset.id : null;
  box.innerHTML = "";
  drag = null;
  pendingRender = false;
  for (const a of state.accounts) {
    const el = document.createElement("button");
    el.type = "button";
    el.className = "acc" + (a.id === state.active ? " active" : "");
    if (a.id === state.active) el.setAttribute("aria-current", "true");
    el.dataset.id = a.id;
    el.style.background = colorOf(a);
    el.title = a.email ? `${a.name} — ${a.email}` : a.name;
    el.textContent = ((a.email || a.name).trim()[0] || "?").toUpperCase();
    if (a.avatar) {
      // L'avatar recouvre la lettre ; s'il ne se charge pas, la lettre reste visible
      const img = new Image();
      img.referrerPolicy = "no-referrer";
      img.onerror = () => img.remove();
      img.src = a.avatar;
      el.appendChild(img);
    }
    el.onclick = () => { if (!dragged) run("switch_account", { id: a.id }); };
    el.onpointerdown = (e) => startDrag(e, el);
    el.onpointermove = (e) => moveDrag(e, el);
    el.onpointerup = el.onpointercancel = () => endDrag(el);
    // Clic droit, ou touche Menu / Maj+F10 au clavier
    el.oncontextmenu = (e) => { e.preventDefault(); invoke("account_menu", { id: a.id }).catch(console.error); };
    box.appendChild(el);
    if (a.id === focused) el.focus();
  }
}

// Réorganisation par glisser-déposer, en événements pointeur (le glisser-déposer HTML5 est
// intercepté par Tauri). Le compte glissé garde la capture du pointeur : pour ne pas la perdre,
// ce sont les autres pastilles que l'on déplace autour de lui, jamais lui.
function startDrag(e, el) {
  if (e.button !== 0) return;
  drag = { el, startY: e.clientY, moved: false };
  el.setPointerCapture(e.pointerId);
}
function moveDrag(e, el) {
  if (!drag || drag.el !== el) return;
  if (!drag.moved && Math.abs(e.clientY - drag.startY) < 6) return;
  drag.moved = true;
  el.classList.add("dragging");
  const box = $("#accounts");
  const others = [...box.children].filter((c) => c !== el);
  const isAbove = (c) => { const r = c.getBoundingClientRect(); return r.top + r.height / 2 < e.clientY; };
  const before = others.filter(isAbove);
  if ([...box.children].indexOf(el) === before.length) return;
  for (const c of before) box.insertBefore(c, el);
  for (const c of others.filter((c) => !before.includes(c))) box.appendChild(c);
}
function endDrag(el) {
  if (!drag || drag.el !== el) return;
  const moved = drag.moved;
  drag = null;
  el.classList.remove("dragging");
  if (!moved) {
    // Mise à jour reçue pendant l'appui : on l'affiche maintenant
    if (pendingRender) render();
    return;
  }
  // Sinon, reorder_accounts renvoie l'état à jour, affiché avec le nouvel ordre
  // Le relâchement déclenche aussi un clic : on l'ignore pour ne pas changer de compte
  dragged = true;
  setTimeout(() => { dragged = false; }, 0);
  run("reorder_accounts", { ids: [...$("#accounts").children].map((c) => c.dataset.id) });
}

// Piloté par le backend : actif pendant le chargement de la vue d'un compte
function setLoading(on) { document.body.classList.toggle("loading", on); }

// Piloté par le backend : aperçu de la couleur choisie dans la fenêtre de choix, effacé par le
// prochain render() si elle n'est pas validée
function previewColor(id, color) {
  const el = [...$("#accounts").children].find((c) => c.dataset.id === id);
  if (el) el.style.background = color;
}

async function run(cmd, args) {
  try {
    state = await invoke(cmd, args);
    applyTheme();
    // Pendant un glisser-déposer, réafficher la liste annulerait le déplacement : on attend la fin
    if (drag) pendingRender = true;
    else render();
  }
  catch (e) { console.error(e); }
}

// Appelée par le backend quand une entrée du menu contextuel natif est choisie
function onAccountMenu(action, id) {
  const a = state.accounts.find((x) => x.id === id);
  if (!a) return;
  if (action === "rename") openPrompt(id);
  else if (action === "color") openPrompt(id, "color");
  else if (action === "remove") run("remove_account", { id });
}

// La saisie du nom et le choix de la couleur se font dans une fenêtre à part : la barre est trop étroite
const openPrompt = (id, kind) => invoke("open_prompt", { id, kind }).catch(console.error);
$("#add").onclick = () => openPrompt(null);

function applyTheme() {
  document.body.classList.toggle("light", state.light);
  $("#theme").title = state.light ? "Thème sombre" : "Thème clair";
}
$("#theme").onclick = () => run("set_theme", { light: !state.light });
document.querySelectorAll(".svc").forEach((b) => {
  b.onclick = () => invoke("open_service", { service: b.dataset.svc }).catch(console.error);
});

run("get_state");
</script>
</body>
</html>
